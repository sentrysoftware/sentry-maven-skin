<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
<head><title>Intentional XHTML AngularJS</title><meta name="protectAngular" content="false" /></head>
<body><div >
<button id="increment" ng-init="counter = 1" ng-click="counter = counter + 1">Increment</button>
<p id="counter" title="{{counter}}">{{counter}}</p>
</div></body>
</html>
